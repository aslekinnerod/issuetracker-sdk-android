name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # gradle-wrapper.jar is a committed binary and a pull request —
      # including one from a fork — supplies the copy this job then
      # executes. Check it against Gradle's published checksums first.
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      # Every module, both variants. Deliberately not a hand-maintained
      # module list: :sample-tv-app was invisible to CI for months
      # because nobody remembered to add it here.
      - name: Build every module (debug + release)
        run: ./gradlew assembleDebug assembleRelease
      - name: Unit tests
        run: ./gradlew testReleaseUnitTest

  # The hold-Play/Pause trigger is a documented SDK contract
  # (sdk-spec/TV_TRIGGERS.md) whose behaviour depends on real key-event
  # timing. RemoteHoldE2ETest asserted it correctly but ran nowhere.
  #
  # OFF until an API key is provisioned. Every test in the suite needs a
  # real one: sample-tv-app has no local.properties on a runner, so the
  # app builds with the it_staging_REPLACE_ME placeholder,
  # Issuetracker.configure() fetches getSdkConfig with it, the backend
  # answers an unknown key with a terminal reason, and
  # AttestationStore.refreshRemoteConfig flips the SDK to one-way
  # TERMINATED before any hold is injected — so twoSecondHoldOpensReporter
  # fails and shortTapDoesNotOpenReporter passes vacuously. sdk-tvos
  # confirmed exactly this behaviour empirically on its own example app.
  #
  # This matters more here than elsewhere: publish.yml's `verify` refuses
  # to release unless ci.yml concluded success for the tagged SHA, so a
  # red job here blocks every Maven Central release.
  #
  # NOT COVERED while this is off: the Android TV hold-Play/Pause
  # trigger and the submission round-trip have no automated coverage at
  # all. The `build` job above still compiles :sample-tv-app in both
  # variants and runs the JVM unit tests, so an API break is caught;
  # a timing regression in the trigger is not.
  #
  # TO ENABLE (no commit needed): add repository secret
  # ISSUETRACKER_TV_E2E_API_KEY, provisioned with no.issuetracker.sampletv
  # in its allowedClients whitelist, then set repository variable
  # TV_E2E=true. Watch the first run on a branch before tagging — these
  # tests have never been green on a runner.
  tv-e2e:
    if: vars.TV_E2E == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Asserted BEFORE the emulator boots, so a rotated or deleted
      # secret is a loud two-second failure rather than twenty minutes
      # of emulator time ending in a TERMINATED SDK and an assertion
      # message that blames the trigger.
      - name: Require a provisioned API key
        env:
          KEY: ${{ secrets.ISSUETRACKER_TV_E2E_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then
            echo "::error::secrets.ISSUETRACKER_TV_E2E_API_KEY is empty. Every test in this suite needs a real key — on the it_staging_REPLACE_ME placeholder the SDK goes TERMINATED at configure() and the reporter never opens. Add a key whitelisted for no.issuetracker.sampletv, or unset the TV_E2E repository variable to turn this job back off." >&2
            exit 1
          fi

      # No notAnnotation filter: with a real key every test in the suite
      # is runnable, including the @RequiresLiveBackend round-trip, and
      # a filtered-out test is a silent gap. The key reaches the app
      # through build.gradle.kts, which prefers this env var over
      # local.properties.
      - name: TV remote-hold contract (Android TV emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ISSUETRACKER_SDK_API_KEY: ${{ secrets.ISSUETRACKER_TV_E2E_API_KEY }}
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: ./gradlew :sample-tv-app:connectedDebugAndroidTest
